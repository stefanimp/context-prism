name: Bug report
description: Report a reproducible issue.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Context Prism version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version
      placeholder: "1.x.x"
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include screenshots or sample notes if they help.
