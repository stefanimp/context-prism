<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Context Prism</title>
  <desc id="desc">A local knowledge graph is routed through a prism into compact context cards.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1117"/>
      <stop offset="0.58" stop-color="#131720"/>
      <stop offset="1" stop-color="#17151e"/>
    </linearGradient>
    <linearGradient id="beamIn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7f9" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#6ee7f9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6ee7f9" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="beamOut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.75"/>
      <stop offset="0.38" stop-color="#a78bfa" stop-opacity="0.62"/>
      <stop offset="0.7" stop-color="#f472b6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <g opacity="0.22" stroke="#64748b" stroke-width="1">
    <path d="M70 160 180 95 305 180 245 300 110 280Z" fill="none"/>
    <path d="M180 95 245 300M305 180 110 280M70 160 245 300"/>
    <path d="M1010 110 1160 150 1215 270 1120 355 985 285Z" fill="none"/>
    <path d="M1010 110 1120 355M1160 150 985 285M1215 270 1010 110"/>
  </g>

  <g opacity="0.92">
    <path d="M80 330 C230 300 330 285 480 292 C545 295 598 305 650 326" stroke="url(#beamIn)" stroke-width="44" stroke-linecap="round" fill="none" filter="url(#softGlow)"/>
    <path d="M706 322 C820 300 950 302 1190 260" stroke="url(#beamOut)" stroke-width="54" stroke-linecap="round" fill="none" filter="url(#softGlow)"/>
  </g>

  <g stroke="#8b5cf6" stroke-width="1.4" opacity="0.75">
    <circle cx="120" cy="200" r="7" fill="#a78bfa"/>
    <circle cx="200" cy="140" r="5" fill="#67e8f9"/>
    <circle cx="280" cy="235" r="6" fill="#a78bfa"/>
    <circle cx="180" cy="325" r="5" fill="#67e8f9"/>
    <circle cx="360" cy="170" r="5" fill="#a78bfa"/>
    <circle cx="430" cy="265" r="7" fill="#67e8f9"/>
    <path d="M120 200 200 140 280 235 180 325 120 200 360 170 430 265 280 235 200 140" fill="none"/>
  </g>

  <g fill="#f8fafc" opacity="0.92">
    <rect x="145" y="235" width="74" height="94" rx="8" transform="rotate(-11 145 235)"/>
    <rect x="245" y="118" width="76" height="96" rx="8" transform="rotate(9 245 118)"/>
    <rect x="334" y="214" width="86" height="102" rx="8" transform="rotate(-7 334 214)"/>
    <rect x="452" y="252" width="58" height="76" rx="8" transform="rotate(13 452 252)"/>
    <rect x="520" y="274" width="48" height="64" rx="7" transform="rotate(-12 520 274)"/>
  </g>
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.62">
    <path d="M160 260h42M158 277h45M157 294h32"/>
    <path d="M260 146h42M258 164h48M259 182h35"/>
    <path d="M350 244h52M348 263h44M349 282h50"/>
    <path d="M465 279h28M463 295h34"/>
    <path d="M531 296h24M529 310h26"/>
  </g>

  <g transform="translate(610 166)">
    <path d="M95 0 190 270H0Z" fill="url(#prism)" stroke="#cbd5e1" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M95 0 94 270M95 0 152 270M95 0 38 270" stroke="#e2e8f0" stroke-opacity="0.24" stroke-width="1.5"/>
    <path d="M0 270H190" stroke="#e2e8f0" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <g transform="translate(938 250)">
    <rect x="0" y="0" width="142" height="74" rx="10" fill="#ecfeff" fill-opacity="0.92" stroke="#67e8f9"/>
    <rect x="28" y="104" width="132" height="66" rx="10" fill="#eef2ff" fill-opacity="0.92" stroke="#a78bfa"/>
    <rect x="178" y="54" width="118" height="66" rx="10" fill="#f8fafc" fill-opacity="0.9" stroke="#94a3b8"/>
    <g stroke="#64748b" stroke-width="4" stroke-linecap="round" opacity="0.72">
      <path d="M22 24h78M22 42h96M22 60h60"/>
      <path d="M50 128h78M50 146h52"/>
      <path d="M198 78h66M198 96h44"/>
    </g>
  </g>

  <text x="80" y="486" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="750" letter-spacing="0">Context Prism</text>
  <text x="83" y="532" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" letter-spacing="0">Local, token-aware context routing for Obsidian</text>
  <text x="83" y="570" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="0">Rank notes locally. Copy focused context. Keep vault content under your control.</text>
</svg>
